name: corner-ops-prod

services:
  postgres:
    image: postgres:17-bookworm
    container_name: corner-ops-prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cornerops
      POSTGRES_USER: cornerops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cornerops -d cornerops"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [production]

  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: corner-ops-prod-app
    restart: unless-stopped
    env_file: /opt/corner-ops/production/.env
    environment:
      NODE_ENV: production
      APP_ENV: production
      DATABASE_DRIVER: postgres
      DATABASE_URL: postgresql://cornerops:${POSTGRES_PASSWORD}@postgres:5432/cornerops
      STORAGE_DRIVER: local
      LOCAL_STORAGE_PATH: /data/uploads
      HEALTHCHECK_DATABASE: "true"
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [production]

volumes:
  postgres_data:
  uploads:

networks:
  production:
