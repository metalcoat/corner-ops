# Staging: the next production release, rehearsed on a copy of production's data.
# Deli network only (no Cloudflare tunnel), no outgoing texts, emails, push or
# provider calls (deploy/staging/make-staging-env.py strips those settings), MX in
# sandbox. Built and refreshed by deploy/staging/refresh-staging.sh.
name: corner-ops-staging

services:
  postgres:
    image: postgres:17-bookworm
    container_name: corner-ops-staging-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cornerops
      POSTGRES_USER: cornerops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Pass --env-file /opt/corner-ops/staging/.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cornerops -d cornerops"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [staging]

  app:
    build:
      context: /opt/corner-ops/staging/app
      dockerfile: Dockerfile
    container_name: corner-ops-staging-app
    restart: unless-stopped
    env_file: /opt/corner-ops/staging/.env
    environment:
      NODE_ENV: production
      APP_ENV: staging
      DATABASE_DRIVER: postgres
      DATABASE_URL: postgresql://cornerops:${POSTGRES_PASSWORD}@postgres:5432/cornerops
      STORAGE_DRIVER: local
      LOCAL_STORAGE_PATH: /data/uploads
      HEALTHCHECK_DATABASE: "true"
    ports:
      - "${STAGING_ADDRESS:?Set STAGING_ADDRESS}:3002:3000"
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [staging]

volumes:
  postgres_data:
  uploads:

networks:
  staging:
