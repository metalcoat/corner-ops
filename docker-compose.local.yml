name: corner-ops

services:
  asterisk:
    build:
      context: ./asterisk
      dockerfile: Dockerfile
    container_name: corner-ops-asterisk
    restart: unless-stopped
    network_mode: host
    environment:
      ASTERISK_3CX_IP: ${ASTERISK_3CX_IP:-192.168.1.46}
      ASTERISK_OPENAI_PROJECT_ID: ${ASTERISK_OPENAI_PROJECT_ID}
      ASTERISK_OPENAI_DID: ${ASTERISK_OPENAI_DID:-+13156057291}
    healthcheck:
      test: ["CMD-SHELL", "asterisk -rx 'core show uptime' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: corner-ops-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_DRIVER: postgres
      DATABASE_URL: postgresql://cornerops:${POSTGRES_PASSWORD}@postgres:5432/cornerops
      STORAGE_DRIVER: local
      LOCAL_STORAGE_PATH: /data/uploads
      HEALTHCHECK_DATABASE: "true"
      LOCAL_DEVELOPMENT: ${LOCAL_DEVELOPMENT:-false}
      ALLOW_REZKU_MENU_IMPORT: ${ALLOW_REZKU_MENU_IMPORT:-false}
      SESSION_SECRET: ${SESSION_SECRET}
      APP_PASSWORD: ${APP_PASSWORD}
      APP_EMAIL: ${APP_EMAIL:-}
      APP_URL: ${APP_URL}
      CUSTOMER_APP_URL: ${CUSTOMER_APP_URL:-https://dev.ordercornerdeli.com}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      ALERT_FROM_EMAIL: ${ALERT_FROM_EMAIL:-}
      EMPLOYEE_NOTIFICATION_FROM_EMAIL: ${EMPLOYEE_NOTIFICATION_FROM_EMAIL:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.hostinger.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      CUSTOMER_EMAIL_FROM: ${CUSTOMER_EMAIL_FROM:-}
      THREE_CX_CRM_SECRET: ${THREE_CX_CRM_SECRET:-}
      THREE_CX_DELI_QUEUE: ${THREE_CX_DELI_QUEUE:-90}
      THREE_CX_DELI_EXTENSIONS: ${THREE_CX_DELI_EXTENSIONS:-95,96}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      ADDRESS_PROVIDER: ${ADDRESS_PROVIDER:-}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      DELI_ORIGIN_LATITUDE: ${DELI_ORIGIN_LATITUDE:-}
      DELI_ORIGIN_LONGITUDE: ${DELI_ORIGIN_LONGITUDE:-}
      DELI_DELIVERY_RADIUS_MILES: ${DELI_DELIVERY_RADIUS_MILES:-12}
      HELCIM_API_TOKEN: ${HELCIM_API_TOKEN:-}
      HELCIM_TERMINAL_ID: ${HELCIM_TERMINAL_ID:-}
      HELCIM_DEVICE_CODE: ${HELCIM_DEVICE_CODE:-}
      HELCIM_WEBHOOK_VERIFIER_TOKEN: ${HELCIM_WEBHOOK_VERIFIER_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_WEBHOOK_SECRET: ${OPENAI_WEBHOOK_SECRET:-}
      OPENAI_ORDERING_MCP_URL: ${OPENAI_ORDERING_MCP_URL:-}
      OPENAI_ORDERING_MCP_TOKEN: ${OPENAI_ORDERING_MCP_TOKEN:-}
      OPENAI_PHONE_TEST_DIDS: ${OPENAI_PHONE_TEST_DIDS:-}
      OPENAI_PHONE_DID_LINES: ${OPENAI_PHONE_DID_LINES:-}
      OPENAI_PHONE_HANDOFF_TARGET: ${OPENAI_PHONE_HANDOFF_TARGET:-}
      OPENAI_PHONE_ORDERING_ENABLED: ${OPENAI_PHONE_ORDERING_ENABLED:-false}
      OPENAI_REALTIME_MODEL: ${OPENAI_REALTIME_MODEL:-gpt-realtime-1.5}
    ports:
      - "3000:3000"
    volumes:
      - cornerops_uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:3000/api/health'').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - cornerops

  postgres:
    image: postgres:17-bookworm
    container_name: corner-ops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cornerops
      POSTGRES_USER: cornerops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - cornerops_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cornerops -d cornerops"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - cornerops

volumes:
  cornerops_postgres_data:
  cornerops_uploads:

networks:
  cornerops:
