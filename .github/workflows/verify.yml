name: Verify Corner Ops

on:
  push:
    branches: [main, agent/pos-ordering-foundation]
  pull_request:
    branches: [main]

concurrency:
  group: corner-ops-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ai-regressions:
    runs-on: [self-hosted]
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: corner_ops_ai_test
        ports: ["45432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres -d corner_ops_ai_test"
          --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      PGHOST: localhost
      PGPORT: 45432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: corner_ops_ai_test
      CI: "true"
      LOCAL_DEVELOPMENT: "true"
      VALIDATION_DATABASE_URL: postgresql://postgres:postgres@localhost:45432/corner_ops_ai_test
      APP_EMAIL: owner@example.test
      APP_ENV: test
      GEMINI_API_KEY: "ci-schema-test"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Generate test secrets
        shell: bash
        run: |
          echo "SESSION_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "VOICE_PAYMENT_INTERNAL_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "EMPLOYMENT_FORMS_ENCRYPTION_KEY=$(openssl rand -base64 32 | tr -d '\n')" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Build isolated regression database and menu fixture
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            name=$(basename "$file")
            if [[ "$name" == 0001* || "$name" > 0007_schedule_delivery_queue.sql ]]; then
              psql -v ON_ERROR_STOP=1 -f "$file"
            fi
          done < <(find db/migrations -maxdepth 1 -type f -name '*.sql' | sort)
          { echo 'BEGIN; SET LOCAL session_replication_role=replica;'; gzip -dc tests/fixtures/ai-menu.sql.gz; echo 'COMMIT;'; } | psql -v ON_ERROR_STOP=1
      - name: Dedicated AI regression suites
        shell: bash
        run: |
          set -euo pipefail
          npm run test:ai-payment-safety
          npm run test:voice-payment-recovery
          npm run test:ai-cart-safety
          npm run test:ai-natural-aliases
          npm run test:ai-followup-modifiers
          npm run test:ai-phone-conversation
          npm run test:ai-order-regressions
          npm run test:ai-ordering
          npm run test:openai-phone
          npm run test:gemini-phone-routing
          npm run test:gemini-phone -- --offline
      - name: Gemini bridge playback and fixed voice regression
        shell: bash
        run: |
          docker run --rm -v "$PWD/asterisk:/bridge:ro" python:3.12-slim sh -c 'pip install --disable-pip-version-check websockets==15.0.1 && python /bridge/gemini-phone.py --self-test'
  build:
    runs-on: [self-hosted]  # liberty-ci-01 on the deli network
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Generate CI-only secrets
        shell: bash
        run: |
          echo "SESSION_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "VOICE_PAYMENT_INTERNAL_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "EMPLOYMENT_FORMS_ENCRYPTION_KEY=$(openssl rand -base64 32 | tr -d '\n')" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: npm ci
      - name: Reject runtime schema DDL
        run: python3 tools/verify_no_runtime_ddl.py
      - name: Dependency security
        run: python3 tools/verify_dependencies.py
      - name: CODEBASEREVIEW regression guard
        # The guard lives on main; this branch doesn't carry it yet.
        run: if [ -f tools/verify_review_regressions.py ]; then python3 tools/verify_review_regressions.py; else echo "No review regression guard on this branch."; fi
      - name: Unit tests
        run: npm test
      - name: Type check
        run: npm run typecheck
      - name: Build application
        run: npm run build
        env:
          APP_EMAIL: owner@example.test
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          BLOB_READ_WRITE_TOKEN: vercel_blob_rw_placeholder
