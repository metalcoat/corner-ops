name: Verify Corner Ops

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: corner-ops-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Build application
        run: npm run build
        env:
          SESSION_SECRET: github-actions-build-placeholder-with-sufficient-length
          EMPLOYMENT_FORMS_ENCRYPTION_KEY: github-actions-employment-key-placeholder-1234567890
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          BLOB_READ_WRITE_TOKEN: vercel_blob_rw_placeholder
