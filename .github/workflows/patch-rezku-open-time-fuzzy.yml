name: Patch Rezku open-time detection

on:
  push:
    paths:
      - .github/workflows/patch-rezku-open-time-fuzzy.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Patch fuzzy order-open detection
        shell: python
        run: |
          from pathlib import Path

          # Payroll repair path
          p = Path('src/lib/repair-rezku-order-times.ts')
          t = p.read_text()
          marker = '''function offsetMilliseconds(date: Date): number {'''
          helper = '''function orderOpenedValue(raw: Record<string, unknown>): unknown {
            const exact = rawLookup(raw, ["Order Opened At", "Opened At", "Open Time", "Order Time", "Created At", "Time"]);
            if (exact !== "") return exact;
            const candidates = Object.entries(raw)
              .filter(([key, value]) => {
                const normalized = normalizedKey(key);
                return value !== undefined && value !== null && String(value).trim() !== ""
                  && (normalized.includes("opened") || normalized.includes("opentime") || normalized.includes("orderopen"));
              })
              .sort(([left], [right]) => {
                const score = (key: string) => {
                  const normalized = normalizedKey(key);
                  if (normalized === "orderopenedat") return 0;
                  if (normalized.includes("openedat")) return 1;
                  if (normalized.includes("orderopen")) return 2;
                  if (normalized.includes("opened")) return 3;
                  return 4;
                };
                return score(left) - score(right);
              });
            return candidates[0]?.[1] ?? "";
          }

          '''
          if 'function orderOpenedValue(raw:' not in t:
            t = t.replace(marker, helper + marker, 1)
          t = t.replace('const openedValue = rawLookup(raw, ["Order Opened At", "Opened At", "Open Time", "Order Time", "Created At", "Time"]);', 'const openedValue = orderOpenedValue(raw);')
          t = t.replace('const rawValue = rawLookup(raw, ["Order Opened At", "Opened At", "Open Time", "Order Time", "Created At", "Time"]);', 'const rawValue = orderOpenedValue(raw);')
          p.write_text(t)

          # Global Eastern-time repair path
          p = Path('src/lib/rezku-eastern-time.ts')
          t = p.read_text()
          marker = '''function sourceKey(parts: unknown[]): string {'''
          helper = '''function orderOpenedValue(raw: RawRow): unknown {
            const exact = rowLookup(raw, ["Order Opened At", "Opened At", "Open Time", "Order Time", "Created At", "Time"]);
            if (exact !== "") return exact;
            const candidates = Object.entries(raw)
              .filter(([key, value]) => {
                const normalized = normalizeKey(key);
                return value !== undefined && value !== null && String(value).trim() !== ""
                  && (normalized.includes("opened") || normalized.includes("opentime") || normalized.includes("orderopen"));
              })
              .sort(([left], [right]) => {
                const score = (key: string) => {
                  const normalized = normalizeKey(key);
                  if (normalized === "orderopenedat") return 0;
                  if (normalized.includes("openedat")) return 1;
                  if (normalized.includes("orderopen")) return 2;
                  if (normalized.includes("opened")) return 3;
                  return 4;
                };
                return score(left) - score(right);
              });
            return candidates[0]?.[1] ?? "";
          }

          function orderRawHasClock(raw: RawRow): boolean {
            return Boolean(timeParts(orderOpenedValue(raw)));
          }

          '''
          if 'function orderOpenedValue(raw:' not in t:
            t = t.replace(marker, helper + marker, 1)
          t = t.replace('const timeValue = rowLookup(raw, ["Order Opened At", "Opened At", "Open Time", "Order Time", "Created At", "Time"]);', 'const timeValue = orderOpenedValue(raw);')
          t = t.replace('hasClock(rawObject(row.raw), ["Order Opened At", "Opened At", "Open Time", "Order Time", "Created At", "Time"])', 'orderRawHasClock(rawObject(row.raw))')
          t = t.replace('hasClock: hasClock(raw, ["Order Opened At", "Opened At", "Open Time", "Order Time", "Created At", "Time"]),', 'hasClock: orderRawHasClock(raw),')
          p.write_text(t)

          # Importer: broaden order-open header list for future imports.
          p = Path('src/lib/operations.ts')
          t = p.read_text()
          t = t.replace('rowLookup(row, ["Order Opened At", "Opened At", "Open Time", "Order Time", "Created At", "Time"])', 'rowLookup(row, ["Order Opened At", "Order Opened", "Opened At", "Opened", "Open Time", "Order Time", "Created At", "Time"])')
          p.write_text(t)

          # Current payroll allocator duplicate preference.
          p = Path('src/lib/payroll-summary-rules.ts')
          t = p.read_text()
          marker = '''function dateValue(value: unknown): Date | null {'''
          helper = '''function rawOrderHasClock(value: unknown): boolean {
            const raw = rawObject(value);
            const exact = ["Order Opened At", "Order Opened", "Opened At", "Opened", "Open Time", "Order Time", "Created At", "Time"]
              .some((field) => /\\d{1,2}:\\d{2}/.test(String(raw[field] || "")));
            if (exact) return true;
            return Object.entries(raw).some(([key, fieldValue]) => {
              const normalized = key.toLowerCase().replace(/[^a-z0-9]/g, "");
              return (normalized.includes("opened") || normalized.includes("opentime") || normalized.includes("orderopen"))
                && /\\d{1,2}:\\d{2}/.test(String(fieldValue || ""));
            });
          }

          '''
          if 'function rawOrderHasClock(value:' not in t:
            t = t.replace(marker, helper + marker, 1)
          t = t.replace('hasClock: rawHasClock(row.raw, ["Order Opened At", "Opened At", "Open Time", "Order Time", "Created At", "Time"]),', 'hasClock: rawOrderHasClock(row.raw),')
          p.write_text(t)

      - name: Verify patch
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm run build
          grep -n "function orderOpenedValue" src/lib/repair-rezku-order-times.ts src/lib/rezku-eastern-time.ts
          grep -n "function rawOrderHasClock" src/lib/payroll-summary-rules.ts
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/repair-rezku-order-times.ts src/lib/rezku-eastern-time.ts src/lib/operations.ts src/lib/payroll-summary-rules.ts
          git diff --cached --check
          git commit -m "Detect Rezku order-open timestamps robustly"
          git push origin HEAD:main
