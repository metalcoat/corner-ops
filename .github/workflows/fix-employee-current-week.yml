name: Cleanup employee schedule patch

on:
  push:
    paths:
      - .github/workflows/fix-employee-current-week.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Remove temporary patch files
        run: |
          git rm .github/workflows/fix-employee-current-week.yml
          git rm .github/patches/fix_employee_current_week.py
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove employee schedule patch scaffolding"
          git push origin HEAD:main
