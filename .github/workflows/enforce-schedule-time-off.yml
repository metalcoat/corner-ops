name: Enforce schedule time off

on:
  push:
    paths:
      - .github/workflows/enforce-schedule-time-off.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Apply patch
        run: python scripts/enforce-schedule-time-off.py
      - name: Verify
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm run build
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/schedule-time-off.ts src/lib/schedule-draft.ts src/lib/schedule-actions.ts src/lib/schedule-week-copy.ts src/lib/schedule-publish-validation.ts src/lib/workforce.ts src/app/api/workforce/route.ts src/app/ops/workforce/page.tsx src/app/ops/workforce/schedule-board.tsx src/app/ops/workforce/schedule-board.css
          git diff --cached --check
          git commit -m "Enforce employee time off in scheduling"
          git push origin HEAD:main
