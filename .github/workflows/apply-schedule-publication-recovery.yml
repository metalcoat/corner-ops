name: Apply schedule publication recovery

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-schedule-publication-recovery.yml

permissions:
  contents: write

concurrency:
  group: schedule-publication-recovery
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply guarded source changes
        run: python3 tools/apply-schedule-publication-recovery.py

      - name: Write valid regression tests
        shell: bash
        run: |
          cat > tests/schedule-publication-recovery.test.ts <<'EOF'
          import test from "node:test";
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          import { join } from "node:path";

          const root = process.cwd();
          const source = (path: string) => readFileSync(join(root, path), "utf8");

          test("schedule publication messages use the threaded message schema", () => {
            const publication = source("src/lib/business-schedule-publication.ts");
            assert.equal(publication.includes("conversation_key"), true);
            assert.equal(publication.includes("'Conversation'"), true);
            assert.equal(publication.includes("INSERT INTO employee_message_recipients"), true);
            assert.equal(publication.includes("owner:${employee.id}"), true);
          });

          test("a failed idempotency reservation is resumed while a draft still exists", () => {
            const publication = source("src/lib/business-schedule-publication.ts");
            assert.equal(publication.includes("let publicationId = crypto.randomUUID()"), true);
            assert.equal(publication.includes("resumeStalledPublication"), true);
            assert.equal(publication.includes("draftRows.length > 0"), true);
            assert.equal(publication.includes('row.delivery_status === "Failed"'), true);
            assert.equal(publication.includes("recoveredStalledAttempt: true"), true);
          });

          test("SMS configuration status is explicitly non-blocking in the manager notice", () => {
            const page = source("src/app/ops/workforce/page.tsx");
            assert.equal(page.includes("SMS unavailable; schedule publication is not blocked"), true);
          });
          EOF

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Type check
        run: npm run typecheck

      - name: Build application
        run: npm run build
        env:
          APP_EMAIL: owner@example.test
          DATABASE_URL: ""
          BLOB_READ_WRITE_TOKEN: vercel_blob_rw_placeholder
          SESSION_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          EMPLOYMENT_FORMS_ENCRYPTION_KEY: abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789

      - name: Commit tested recovery
        shell: bash
        run: |
          rm -f .github/workflows/apply-schedule-publication-recovery.yml
          rm -f tools/apply-schedule-publication-recovery.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Repair stuck schedule publication attempts" \
            -m "Write schedule notices through the threaded message schema, resume failed idempotent publication reservations, and make SMS availability explicitly non-blocking."
          git pull --rebase origin main
          git push origin HEAD:main
