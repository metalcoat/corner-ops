name: One-time Rezku recovery

on:
  push:
    paths:
      - ".github/workflows/rezku-recover-once.yml"

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Recover disabled Rezku inbound feed
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            code=$(curl -sS -o /tmp/recovery.json -w "%{http_code}" \
              -X POST \
              -H "x-recovery-key: k78aWdv_HAF-yvHeZWvsdwbPWw3n0EX8-tSmKgre1Kw" \
              https://corner-ops.vercel.app/api/rezku/recover || true)
            cat /tmp/recovery.json || true
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "Recovery endpoint never returned HTTP 200." >&2
          exit 1
