name: Finish message and global business navigation

on:
  push:
    branches:
      - fix/message-scroll-global-business-switch
    paths:
      - .github/workflows/finish-message-nav.yml
      - src/app/global-nav.tsx
      - src/app/global-nav.css

permissions:
  contents: write

concurrency:
  group: finish-message-global-business-navigation
  cancel-in-progress: false

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply remaining guarded changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if new in text:
                  return
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one match in {path}, found {count}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          def append_once(path: str, marker: str, addition: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if marker in text:
                  return
              target.write_text(text.rstrip() + "\n\n" + addition.strip() + "\n", encoding="utf-8")

          replace_once(
              "src/app/use-message-thread-behavior.ts",
              '    window.addEventListener("resize", updateViewport);\n    document.addEventListener("focusin", delayedUpdate);',
              '    window.addEventListener("resize", updateViewport);\n    window.addEventListener("corner-ops-layout-change", updateViewport);\n    document.addEventListener("focusin", delayedUpdate);',
          )
          replace_once(
              "src/app/use-message-thread-behavior.ts",
              '      window.removeEventListener("resize", updateViewport);\n      document.removeEventListener("focusin", delayedUpdate);',
              '      window.removeEventListener("resize", updateViewport);\n      window.removeEventListener("corner-ops-layout-change", updateViewport);\n      document.removeEventListener("focusin", delayedUpdate);',
          )

          replace_once(
              "src/app/pwa-client.tsx",
              'import { useCallback, useEffect, useRef, useState } from "react";',
              'import { useCallback, useEffect, useRef, useState } from "react";\nimport { usePathname } from "next/navigation";',
          )
          replace_once(
              "src/app/pwa-client.tsx",
              'export default function PwaClient() {\n  const [status, setStatus] = useState<PushStatus | null>(null);',
              'export default function PwaClient() {\n  const pathname = usePathname();\n  const [status, setStatus] = useState<PushStatus | null>(null);',
          )
          replace_once(
              "src/app/pwa-client.tsx",
              '  if (!status) return null;',
              '  if (pathname.startsWith("/ops/messages") || pathname.startsWith("/employee/messages")) return null;\n  if (!status) return null;',
          )

          append_once(
              "src/app/message-inbox.css",
              "/* Browser message thread reachability. */",
              '''/* Browser message thread reachability. */
          .messageThread{flex:1 1 0%;min-height:0;overflow-y:auto;scroll-padding-bottom:1.25rem}
          .messageThreadPane>.messageComposer,.messageThreadPane>.messageReadOnlyComposer{flex:0 0 auto}''',
          )

          append_once(
              "tests/message-image-and-scroll.test.ts",
              'test("the sticky header owns the only visible business switcher"',
              '''test("the sticky header owns the only visible business switcher", () => {
            const nav = source("src/app/global-nav.tsx");
            const css = source("src/app/global-nav.css");
            assert.equal(nav.includes("globalBusinessSwitch"), true);
            assert.equal(nav.includes("corner-ops-business-change"), true);
            assert.equal(nav.includes("synchronizeLegacyBusinessControls"), true);
            assert.equal(nav.includes("data-global-business-switcher"), true);
            assert.equal(css.includes('[data-legacy-business-switcher="true"]'), true);
            assert.equal(css.includes("display: none !important"), true);
          });

          test("management message scrolling reacts to header height and has no install control overlay", () => {
            const behavior = source("src/app/use-message-thread-behavior.ts");
            const css = source("src/app/message-inbox.css");
            const pwa = source("src/app/pwa-client.tsx");
            assert.equal(behavior.includes("corner-ops-layout-change"), true);
            assert.equal(css.includes("/* Browser message thread reachability. */"), true);
            assert.equal(css.includes("flex:1 1 0%"), true);
            assert.equal(pwa.includes('pathname.startsWith("/ops/messages")'), true);
            assert.equal(pwa.includes('pathname.startsWith("/employee/messages")'), true);
          });''',
          )
          PY

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Type check
        run: npm run typecheck

      - name: Build application
        run: npm run build
        env:
          APP_EMAIL: owner@example.test
          DATABASE_URL: ""
          BLOB_READ_WRITE_TOKEN: vercel_blob_rw_placeholder
          SESSION_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          EMPLOYMENT_FORMS_ENCRYPTION_KEY: abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789

      - name: Commit verified changes
        shell: bash
        run: |
          rm -f .github/workflows/finish-message-nav.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finish message scrolling and global business navigation" \
            -m "Keep the Corner Deli/Tiki control in the sticky owner header, hide duplicate page controls, preserve image paste/upload, keep browser message threads reachable, and remove the install control from message screens."
          git pull --rebase origin fix/message-scroll-global-business-switch
          git push origin HEAD:fix/message-scroll-global-business-switch
