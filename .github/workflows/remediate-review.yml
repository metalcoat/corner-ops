name: Apply CODEBASEREVIEW remediation

on:
  push:
    branches:
      - agent/full-codebase-review-remediation
    paths:
      - tools/remediate_review.py
      - tools/remediate_review_fixups.py
      - .github/workflows/remediate-review.yml

permissions:
  contents: write

concurrency:
  group: corner-ops-review-remediation
  cancel-in-progress: false

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out remediation branch
        uses: actions/checkout@v4
        with:
          ref: agent/full-codebase-review-remediation
          fetch-depth: 0
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply, verify, and report
        shell: bash
        env:
          SESSION_SECRET: github-actions-session-secret-with-more-than-64-bits-of-test-entropy
          APP_EMAIL: owner@example.test
          EMPLOYMENT_FORMS_ENCRYPTION_KEY: Y2ktb25seS0zMi1ieXRlLWVtcGxveW1lbnQta2V5ISE=
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          BLOB_READ_WRITE_TOKEN: vercel_blob_rw_placeholder
        run: |
          set +e
          LOG=/tmp/remediation.log
          : > "$LOG"

          python3 tools/remediate_review.py >>"$LOG" 2>&1
          SCRIPT_RC=$?
          if [ "$SCRIPT_RC" -eq 0 ]; then python3 tools/remediate_review_fixups.py >>"$LOG" 2>&1; FIXUP_RC=$?; else FIXUP_RC=99; fi
          if [ "$SCRIPT_RC" -eq 0 ] && [ "$FIXUP_RC" -eq 0 ]; then npm ci >>"$LOG" 2>&1; INSTALL_RC=$?; else INSTALL_RC=99; fi
          if [ "$SCRIPT_RC" -eq 0 ] && [ "$FIXUP_RC" -eq 0 ] && [ "$INSTALL_RC" -eq 0 ]; then npm test >>"$LOG" 2>&1; TEST_RC=$?; else TEST_RC=99; fi
          if [ "$SCRIPT_RC" -eq 0 ] && [ "$FIXUP_RC" -eq 0 ] && [ "$INSTALL_RC" -eq 0 ] && [ "$TEST_RC" -eq 0 ]; then npm run typecheck >>"$LOG" 2>&1; TYPE_RC=$?; else TYPE_RC=99; fi
          if [ "$SCRIPT_RC" -eq 0 ] && [ "$FIXUP_RC" -eq 0 ] && [ "$INSTALL_RC" -eq 0 ] && [ "$TEST_RC" -eq 0 ] && [ "$TYPE_RC" -eq 0 ]; then npm run build >>"$LOG" 2>&1; BUILD_RC=$?; else BUILD_RC=99; fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$SCRIPT_RC" -eq 0 ] && [ "$FIXUP_RC" -eq 0 ] && [ "$INSTALL_RC" -eq 0 ] && [ "$TEST_RC" -eq 0 ] && [ "$TYPE_RC" -eq 0 ] && [ "$BUILD_RC" -eq 0 ]; then
            {
              echo "# CODEBASEREVIEW remediation status"
              echo
              echo "Result: SUCCESS"
              echo "Batch: Stage 1 payroll and scheduling"
              echo "Source commit: $GITHUB_SHA"
              echo
              echo "Tests, TypeScript typecheck, and Next production build all passed before this commit."
            } > .review-remediation-status.md
            git add -A
            git diff --cached --check || exit 1
            if ! git diff --cached --quiet; then
              git commit -m "Stage 1 fix payroll and scheduling correctness"
              git push origin HEAD:agent/full-codebase-review-remediation
            fi
            exit 0
          fi

          FAIL_LOG=$(tail -n 120 "$LOG")
          git reset --hard "$GITHUB_SHA"
          {
            echo "# CODEBASEREVIEW remediation status"
            echo
            echo "Result: FAILED"
            echo "Batch: Stage 1 payroll and scheduling"
            echo "Source commit: $GITHUB_SHA"
            echo "Exit codes: transform=$SCRIPT_RC fixups=$FIXUP_RC install=$INSTALL_RC test=$TEST_RC typecheck=$TYPE_RC build=$BUILD_RC"
            echo
            echo '```text'
            printf '%s\n' "$FAIL_LOG"
            echo '```'
          } > .review-remediation-status.md
          git add .review-remediation-status.md
          git commit -m "Record Stage 1 remediation failure"
          git push origin HEAD:agent/full-codebase-review-remediation
          exit 1
