name: Apply delivery tip fallback patch

on:
  push:
    paths:
      - .github/workflows/apply-delivery-tip-fallback.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Patch payroll delivery fallback
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("src/lib/payroll-summary-rules.ts")
          text = path.read_text()

          text = text.replace("const DRIVER_GRACE_MINUTES = 35;\n", "")

          text, count = re.subn(
              r"\nfunction nextDriversWithinGrace\(shifts: Shift\[\], time: Date\): Shift\[\] \{.*?\n\}\n\nfunction splitCents",
              "\nfunction splitCents",
              text,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f"Expected to remove one nextDriversWithinGrace function, removed {count}")

          allocation_start = text.index("function allocateTips(")
          delivery_start = text.index("    } else if (delivery) {", allocation_start)
          pickup_start = text.index(
              "    } else {\n      eligible = uniqueEmployees(shifts.filter((shift) => isEligible(shift) && !isDriver(shift) && covers(shift, time)));",
              delivery_start,
          )
          new_delivery = '''    } else if (delivery) {
              eligible = uniqueEmployees(shifts.filter((shift) => isEligible(shift) && isDriver(shift) && covers(shift, time)));
              if (eligible.length) {
                rule = "After 3 PM delivery order: assigned to driver clocked in";
              } else {
                eligible = uniqueEmployees(shifts.filter((shift) => isEligible(shift) && !isDriver(shift) && covers(shift, time)));
                rule = "After 3 PM delivery fallback: no driver clocked in; equally split among non-driver employees clocked in";
              }

              if (!eligible.length) {
                details.push({
                  ...detailBase(transaction),
                  allocatedTipBeforeFee: 0,
                  feeAmount: 0,
                  allocatedTip: 0,
                  employee: "Unallocated",
                  splitCount: 0,
                  rule: "After 3 PM delivery: no driver or other tip-eligible employee was clocked in",
                });
                continue;
              }
          '''
          text = text[:delivery_start] + new_delivery + text[pickup_start:]

          text = text.replace(
              '''    const scheduleEnd = new Date(end.getTime() + DRIVER_GRACE_MINUTES * 60_000);\n    const rows = await getSql()`''',
              '''    const rows = await getSql()`''',
          )
          text = text.replace(
              '''        AND s.starts_at < ${scheduleEnd.toISOString()}''',
              '''        AND s.starts_at < ${end.toISOString()}''',
          )

          start = text.index("function driverCoverageWarnings(")
          finish = text.index("\nexport async function payrollSummary", start)
          warning_function = '''function driverCoverageWarnings(
            details: Array<Record<string, unknown>>,
            scheduledDrivers: ScheduledDriver[],
          ): DriverCoverageWarning[] {
            const byDay = new Map<string, {
              orderKeys: Set<string>;
              tipsCents: number;
              scheduledDrivers: Set<string>;
            }>();

            for (const detail of details) {
              if (!String(detail.rule || "").startsWith("After 3 PM delivery fallback:")) continue;
              const openedAt = dateValue(detail.orderOpenedAt);
              if (!openedAt) continue;
              const date = localDayKey(openedAt);
              const current = byDay.get(date) || {
                orderKeys: new Set<string>(),
                tipsCents: 0,
                scheduledDrivers: new Set<string>(),
              };
              const orderKey = `${String(detail.orderId || "")}|${openedAt.toISOString()}|${String(detail.transactionTime || "")}`;
              if (!current.orderKeys.has(orderKey)) {
                current.orderKeys.add(orderKey);
                current.tipsCents += Math.round(numberValue(detail.originalTip) * 100);
              }

              for (const scheduled of scheduledDrivers) {
                if (scheduled.startsAt.getTime() <= openedAt.getTime() && scheduled.endsAt.getTime() >= openedAt.getTime()) {
                  current.scheduledDrivers.add(scheduled.employeeName);
                }
              }
              byDay.set(date, current);
            }

            return [...byDay.entries()]
              .sort(([left], [right]) => left.localeCompare(right))
              .filter(([, value]) => value.scheduledDrivers.size > 0)
              .map(([date, value]) => {
                const names = [...value.scheduledDrivers].sort();
                return {
                  date,
                  orderCount: value.orderKeys.size,
                  tipsBeforeFee: value.tipsCents / 100,
                  scheduledDrivers: names,
                  message: `Driver punch missing: ${names.join(", ")} was scheduled as Driver, but no Driver punch covered these deliveries. Tips fell back to the tip-eligible staff actually clocked in.`,
                };
              });
          }
          '''
          text = text[:start] + warning_function + text[finish:]

          text = text.replace(
              'source: "Rezku daily email reports · tips allocated by Order Export opened time · 35-minute future-driver grace",',
              'source: "Rezku daily email reports · tips allocated by Order Export opened time · no-driver fallback splits among clocked-in staff",',
          )

          path.write_text(text)
      - name: Commit payroll fallback
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/payroll-summary-rules.ts
          git diff --cached --check
          git commit -m "Use clocked-in staff fallback for delivery tips"
          git push origin HEAD:main
