name: Shift correction production hotfix

on:
  push:
    branches: [fix/production-shift-corrections]
    paths:
      - tools/fix_shift_correction.py
      - .github/workflows/shift-correction-hotfix.yml

permissions:
  contents: write

concurrency:
  group: shift-correction-production-hotfix
  cancel-in-progress: true

jobs:
  hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/production-shift-corrections
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Generate CI-only secrets
        shell: bash
        run: |
          echo "SESSION_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "OWNER_SESSION_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "EMPLOYEE_SESSION_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "DELI_BOARD_SESSION_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "EMPLOYEE_PIN_PEPPER=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "INTEGRATION_ENCRYPTION_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "SQUARE_OAUTH_STATE_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "KEY_ENCRYPTION_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "EMPLOYMENT_FORMS_ENCRYPTION_KEY=$(openssl rand -base64 32 | tr -d '\n')" >> "$GITHUB_ENV"
          echo "APP_EMAIL=owner@example.test" >> "$GITHUB_ENV"
          echo "APP_PASSWORD=$(openssl rand -base64 32 | tr -d '\n')" >> "$GITHUB_ENV"
          echo "DATABASE_URL=postgresql://placeholder:placeholder@localhost:5432/placeholder" >> "$GITHUB_ENV"
          echo "BLOB_READ_WRITE_TOKEN=vercel_blob_rw_placeholder" >> "$GITHUB_ENV"
      - name: Apply and verify hotfix
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/fix_shift_correction.py
          npm ci
          python3 tools/verify_review_regressions.py
          npm test
          npm run typecheck
          npm run build
      - name: Commit verified hotfix
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/fix_shift_correction.py .github/workflows/shift-correction-hotfix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix published shift corrections"
          git pull --rebase origin fix/production-shift-corrections
          git push origin HEAD:fix/production-shift-corrections
