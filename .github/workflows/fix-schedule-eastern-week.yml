name: Fix schedule Eastern week

on:
  push:
    paths:
      - .github/workflows/fix-schedule-eastern-week.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Make schedule week timezone deterministic
        shell: python
        run: |
          from pathlib import Path

          p = Path('src/app/ops/workforce/schedule-board.tsx')
          t = p.read_text()

          old = '''const DAY_MS = 86_400_000;
const MINUTE_MS = 60_000;
const UNASSIGNED_KEY = "__unassigned__";'''
          new = '''const DAY_MS = 86_400_000;
const MINUTE_MS = 60_000;
const TIME_ZONE = "America/New_York";
const UNASSIGNED_KEY = "__unassigned__";'''
          if old not in t:
              raise SystemExit('constants block not found')
          t = t.replace(old, new, 1)

          start = t.find('function startOfMonday(date: Date): Date {')
          end = t.find('\n\nfunction inputTime(', start)
          if start < 0 or end < 0:
              raise SystemExit('date helper block not found')

          helpers = r'''function easternDateKey(date: Date): string {
  const parts = new Intl.DateTimeFormat("en-CA", {
    timeZone: TIME_ZONE,
    year: "numeric",
    month: "2-digit",
    day: "2-digit",
  }).formatToParts(date);
  const values = Object.fromEntries(parts.map((part) => [part.type, part.value]));
  return `${values.year}-${values.month}-${values.day}`;
}

function getOffsetMilliseconds(date: Date): number {
  const parts = new Intl.DateTimeFormat("en-US", {
    timeZone: TIME_ZONE,
    year: "numeric",
    month: "2-digit",
    day: "2-digit",
    hour: "2-digit",
    minute: "2-digit",
    second: "2-digit",
    hourCycle: "h23",
  }).formatToParts(date);
  const values = Object.fromEntries(parts.map((part) => [part.type, part.value]));
  const represented = Date.UTC(
    Number(values.year), Number(values.month) - 1, Number(values.day),
    Number(values.hour), Number(values.minute), Number(values.second),
  );
  return represented - date.getTime();
}

function easternDateKeyToUtc(dateText: string): Date {
  const [year, month, day] = dateText.split("-").map(Number);
  const wall = Date.UTC(year, month - 1, day, 0, 0, 0);
  let timestamp = wall;
  for (let index = 0; index < 3; index += 1) {
    timestamp = wall - getOffsetMilliseconds(new Date(timestamp));
  }
  return new Date(timestamp);
}

function calendarAddDays(dateText: string, days: number): string {
  const date = new Date(`${dateText}T12:00:00Z`);
  date.setUTCDate(date.getUTCDate() + days);
  return date.toISOString().slice(0, 10);
}

function startOfMonday(date: Date): Date {
  const todayKey = easternDateKey(date);
  const calendar = new Date(`${todayKey}T12:00:00Z`);
  const weekday = calendar.getUTCDay();
  const mondayKey = calendarAddDays(todayKey, -((weekday + 6) % 7));
  return easternDateKeyToUtc(mondayKey);
}

function addDays(date: Date, days: number): Date {
  return easternDateKeyToUtc(calendarAddDays(easternDateKey(date), days));
}

function dateKey(date: Date): string {
  return easternDateKey(date);
}

function dateFromKey(value: string): Date {
  return easternDateKeyToUtc(value);
}

function localTime(value: string): string {
  return new Date(value).toLocaleTimeString([], {
    timeZone: TIME_ZONE,
    hour: "numeric",
    minute: "2-digit",
  });
}

function localDateTime(value: string): string {
  return new Date(value).toLocaleString([], {
    timeZone: TIME_ZONE,
    weekday: "short",
    month: "short",
    day: "numeric",
    hour: "numeric",
    minute: "2-digit",
  });
}'''

          t = t[:start] + helpers + t[end:]
          p.write_text(t)

      - name: Verify
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm run build
          grep -n 'TIME_ZONE = "America/New_York"' src/app/ops/workforce/schedule-board.tsx
          grep -n 'return easternDateKey(date);' src/app/ops/workforce/schedule-board.tsx

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/ops/workforce/schedule-board.tsx
          git diff --cached --check
          git commit -m "Keep schedule weeks on Eastern calendar"
          git push origin HEAD:main
