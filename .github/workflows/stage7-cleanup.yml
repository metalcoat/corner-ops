name: Apply CODEBASEREVIEW Stage 7 Cleanup

on:
  push:
    branches:
      - agent/codebase-review-stage-7
    paths:
      - tools/stage7_cleanup.py
      - .github/workflows/stage7-cleanup.yml

permissions:
  contents: write

concurrency:
  group: corner-ops-stage7-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/codebase-review-stage-7
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Generate CI-only secrets
        shell: bash
        run: |
          echo "SESSION_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "OWNER_SESSION_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "EMPLOYEE_SESSION_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "DELI_BOARD_SESSION_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "EMPLOYEE_PIN_PEPPER=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "INTEGRATION_ENCRYPTION_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "SQUARE_OAUTH_STATE_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "KEY_ENCRYPTION_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "EMPLOYMENT_FORMS_ENCRYPTION_KEY=$(openssl rand -base64 32 | tr -d '\n')" >> "$GITHUB_ENV"
          echo "APP_EMAIL=owner@example.test" >> "$GITHUB_ENV"
          echo "APP_PASSWORD=$(openssl rand -base64 32 | tr -d '\n')" >> "$GITHUB_ENV"
          echo "DATABASE_URL=postgresql://placeholder:placeholder@localhost:5432/placeholder" >> "$GITHUB_ENV"
          echo "BLOB_READ_WRITE_TOKEN=vercel_blob_rw_placeholder" >> "$GITHUB_ENV"
      - name: Apply cleanup, upgrade spreadsheet parser, and verify
        shell: bash
        run: |
          set +e
          LOG=/tmp/stage7-cleanup.log
          : > "$LOG"
          python3 tools/stage7_cleanup.py >>"$LOG" 2>&1
          TRANSFORM_RC=$?
          if [ "$TRANSFORM_RC" -eq 0 ]; then
            npm install --save https://cdn.sheetjs.com/xlsx-0.20.3/xlsx-0.20.3.tgz >>"$LOG" 2>&1
            INSTALL_RC=$?
          else
            INSTALL_RC=99
          fi

          # npm's registry advisory cannot model maintained SheetJS releases distributed from
          # the project's CDN. Verify that exact fixed artifact, then fail on every other
          # high/critical advisory instead of globally suppressing audit failures.
          if [ "$TRANSFORM_RC" -eq 0 ] && [ "$INSTALL_RC" -eq 0 ]; then
            npm audit --json >/tmp/npm-audit.json 2>>"$LOG"
            python3 - <<'PY' >>"$LOG" 2>&1
          import json, sys
          from pathlib import Path

          lock = json.loads(Path('package-lock.json').read_text())
          xlsx = lock.get('packages', {}).get('node_modules/xlsx', {})
          expected = 'https://cdn.sheetjs.com/xlsx-0.20.3/xlsx-0.20.3.tgz'
          if xlsx.get('version') != '0.20.3' or xlsx.get('resolved') != expected:
              print('SheetJS provenance check failed:', xlsx)
              sys.exit(1)

          audit = json.loads(Path('/tmp/npm-audit.json').read_text())
          remaining = []
          for name, finding in audit.get('vulnerabilities', {}).items():
              severity = str(finding.get('severity', '')).lower()
              if severity not in {'high', 'critical'}:
                  continue
              if name == 'xlsx':
                  print('Ignoring stale npm-registry xlsx advisory after verified official SheetJS 0.20.3 CDN install.')
                  continue
              remaining.append((name, severity, finding.get('via')))
          if remaining:
              print('Unsuppressed high/critical npm audit findings:')
              for item in remaining:
                  print(item)
              sys.exit(1)
          print('Dependency audit passed: official SheetJS 0.20.3 verified; no other high/critical findings.')
          PY
            AUDIT_RC=$?
          else
            AUDIT_RC=99
          fi

          if [ "$TRANSFORM_RC" -eq 0 ] && [ "$INSTALL_RC" -eq 0 ]; then npm test >>"$LOG" 2>&1; TEST_RC=$?; else TEST_RC=99; fi
          if [ "$TRANSFORM_RC" -eq 0 ] && [ "$INSTALL_RC" -eq 0 ] && [ "$TEST_RC" -eq 0 ]; then npm run typecheck >>"$LOG" 2>&1; TYPE_RC=$?; else TYPE_RC=99; fi
          if [ "$TRANSFORM_RC" -eq 0 ] && [ "$INSTALL_RC" -eq 0 ] && [ "$TEST_RC" -eq 0 ] && [ "$TYPE_RC" -eq 0 ]; then npm run build >>"$LOG" 2>&1; BUILD_RC=$?; else BUILD_RC=99; fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$TRANSFORM_RC" -eq 0 ] && [ "$INSTALL_RC" -eq 0 ] && [ "$AUDIT_RC" -eq 0 ] && [ "$TEST_RC" -eq 0 ] && [ "$TYPE_RC" -eq 0 ] && [ "$BUILD_RC" -eq 0 ]; then
            rm -f tools/stage7_cleanup.py .github/workflows/stage7-cleanup.yml .stage7-cleanup-status.md
            git add -A
            git diff --cached --check || exit 1
            git commit -m "Stage 7 clean repository CSS and spreadsheet dependency"
            git push origin HEAD:agent/codebase-review-stage-7
            exit 0
          fi

          FAIL_LOG=$(tail -n 300 "$LOG")
          git reset --hard "$GITHUB_SHA"
          {
            echo "# Stage 7 cleanup status"
            echo
            echo "Result: FAILED"
            echo "Source commit: $GITHUB_SHA"
            echo "Exit codes: transform=$TRANSFORM_RC install=$INSTALL_RC audit=$AUDIT_RC test=$TEST_RC typecheck=$TYPE_RC build=$BUILD_RC"
            echo
            echo '```text'
            printf '%s\n' "$FAIL_LOG"
            echo '```'
          } > .stage7-cleanup-status.md
          git add .stage7-cleanup-status.md
          git commit -m "Record Stage 7 cleanup failure"
          git push origin HEAD:agent/codebase-review-stage-7
          exit 1
