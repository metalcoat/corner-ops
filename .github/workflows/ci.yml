name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - name: Temporary Rezku timestamp reprocess
        if: github.event_name == 'push' && contains(github.event.head_commit.message, 'Trigger Rezku time reprocess via CI')
        shell: bash
        run: |
          set -euo pipefail
          URL='https://corner-ops.vercel.app/api/temporary-rezku-time-reprocess?token=8p9hMC6eR9-6nn1Q72vMS5Q8iX8yE1wLVY2TaqhHTXM'
          for attempt in $(seq 1 20); do
            echo "Attempt $attempt"
            if curl --fail --silent --show-error --max-time 300 "$URL" -o response.json; then
              cat response.json
              exit 0
            fi
            sleep 15
          done
          echo 'Reprocess endpoint did not succeed.' >&2
          exit 1
