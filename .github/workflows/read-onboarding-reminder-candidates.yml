name: Verify production onboarding reminder delivery

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/read-onboarding-reminder-candidates.yml

permissions:
  contents: read

jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for all three onboarding reminder results
        shell: bash
        run: |
          set -euo pipefail
          url="https://corner-ops.vercel.app/onboarding-reminder-send-result.json?commit=${GITHUB_SHA}"
          last=""
          for attempt in $(seq 1 48); do
            body="$(curl --fail --silent --show-error --header 'Cache-Control: no-cache' "$url" 2>/dev/null || true)"
            if [ -n "$body" ]; then last="$body"; fi
            if printf '%s' "$body" | grep -q '"sentOrPreviouslySent": 3'; then
              echo "ONBOARDING_SEND_RESULT_BEGIN"
              printf '%s\n' "$body"
              echo "ONBOARDING_SEND_RESULT_END"
              exit 0
            fi
            sleep 15
          done
          echo "ONBOARDING_SEND_RESULT_LAST_BEGIN"
          printf '%s\n' "$last"
          echo "ONBOARDING_SEND_RESULT_LAST_END"
          echo "Production did not confirm all three onboarding reminder texts after 12 minutes." >&2
          exit 1
