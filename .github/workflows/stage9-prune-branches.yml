name: Prune CODEBASEREVIEW branches

on:
  push:
    branches: [agent/codebase-review-stage-9]
    paths: [.github/workflows/stage9-prune-branches.yml]

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/codebase-review-stage-9
          fetch-depth: 0
      - name: Remove merged and abandoned remediation branches
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            agent/codebase-review-stage-2
            agent/codebase-review-stage-3
            agent/codebase-review-stage-4
            agent/codebase-review-stage-5
            agent/codebase-review-stage-5-runtime
            agent/codebase-review-stage-6
            agent/codebase-review-stage-7
            agent/codebase-review-stage-7-structural
            agent/codebase-review-stage-8
            agent/fix-3cx-abandoned-calls
            agent/fix-tiki-tip-allocation
            agent/full-codebase-review-remediation
            agent/mobile-employee-messages
            agent/optimize-mobile-profile-photo
            agent/rebuild-corner-ops
            agent/rezku-reliability-hotfix
            agent/vercel-cost-stabilization
          )
          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              echo "Deleting $branch"
              git push origin --delete "$branch"
            fi
          done
      - name: Remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/stage9-prune-branches.yml
          git commit -m "Remove completed branch-pruning workflow"
          git push origin HEAD:agent/codebase-review-stage-9
