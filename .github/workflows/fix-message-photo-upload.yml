name: Fix message photo upload

on:
  push:
    paths:
      - .github/workflows/fix-message-photo-upload.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Apply patch
        run: python scripts/fix-message-photo-upload.py
      - name: Verify
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm run build
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/employee/messages-dock.tsx src/app/api/employee/route.ts
          git diff --cached --check
          git commit -m "Resize message photos before Vercel upload"
          git push origin HEAD:main
