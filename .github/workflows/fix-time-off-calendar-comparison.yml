name: Fix time-off calendar comparison

on:
  push:
    paths:
      - .github/workflows/fix-time-off-calendar-comparison.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Apply correction
        run: python scripts/fix-time-off-calendar-comparison.py
      - name: Verify
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm run build
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/schedule-time-off.ts src/lib/workforce.ts src/lib/schedule-publish-validation.ts src/lib/schedule-week-copy.ts
          git diff --cached --check
          git commit -m "Use New York calendar dates for time off"
          git push origin HEAD:main
