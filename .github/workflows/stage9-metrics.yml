name: Stage 9 Residual Metrics

on:
  push:
    branches: [agent/codebase-review-stage-9]
    paths:
      - tools/stage9_metrics.py
      - .github/workflows/stage9-metrics.yml

permissions:
  contents: write

concurrency:
  group: corner-ops-stage9-metrics
  cancel-in-progress: true

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/codebase-review-stage-9
      - run: python3 tools/stage9_metrics.py
      - name: Commit metrics
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .stage9-metrics.md
          git commit -m "Record Stage 9 residual metrics" || exit 0
          git push origin HEAD:agent/codebase-review-stage-9
