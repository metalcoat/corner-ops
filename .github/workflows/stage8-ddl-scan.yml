name: Stage 8 Runtime DDL Scan

on:
  push:
    branches:
      - agent/codebase-review-stage-8
    paths:
      - tools/stage8_ddl_scan.py
      - .github/workflows/stage8-ddl-scan.yml

permissions:
  contents: write

concurrency:
  group: corner-ops-stage8-ddl-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/codebase-review-stage-8
      - run: python3 tools/stage8_ddl_scan.py
      - name: Commit report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .stage8-ddl-scan.md
          git commit -m "Record Stage 8 runtime DDL scan" || exit 0
          git push origin HEAD:agent/codebase-review-stage-8
