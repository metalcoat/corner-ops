name: Apply CODEBASEREVIEW Stage 2

on:
  push:
    branches:
      - agent/codebase-review-stage-2
    paths:
      - tools/stage2_accounting.py
      - tools/stage2_integrations.py
      - tools/stage2_posting.py
      - tools/stage2_reversal.py
      - .github/workflows/stage2-remediation.yml

permissions:
  contents: write

concurrency:
  group: corner-ops-stage2-remediation
  cancel-in-progress: false

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/codebase-review-stage-2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply and verify Stage 2
        shell: bash
        env:
          SESSION_SECRET: github-actions-session-secret-with-more-than-64-bits-of-test-entropy
          APP_EMAIL: owner@example.test
          EMPLOYMENT_FORMS_ENCRYPTION_KEY: Y2ktb25seS0zMi1ieXRlLWVtcGxveW1lbnQta2V5ISE=
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          BLOB_READ_WRITE_TOKEN: vercel_blob_rw_placeholder
        run: |
          set +e
          LOG=/tmp/stage2.log
          : > "$LOG"
          for script in tools/stage2_accounting.py tools/stage2_integrations.py tools/stage2_posting.py tools/stage2_reversal.py; do
            python3 "$script" >>"$LOG" 2>&1 || { SCRIPT_RC=$?; break; }
          done
          SCRIPT_RC=${SCRIPT_RC:-0}
          if [ "$SCRIPT_RC" -eq 0 ]; then npm ci >>"$LOG" 2>&1; INSTALL_RC=$?; else INSTALL_RC=99; fi
          if [ "$SCRIPT_RC" -eq 0 ] && [ "$INSTALL_RC" -eq 0 ]; then npm test >>"$LOG" 2>&1; TEST_RC=$?; else TEST_RC=99; fi
          if [ "$SCRIPT_RC" -eq 0 ] && [ "$INSTALL_RC" -eq 0 ] && [ "$TEST_RC" -eq 0 ]; then npm run typecheck >>"$LOG" 2>&1; TYPE_RC=$?; else TYPE_RC=99; fi
          if [ "$SCRIPT_RC" -eq 0 ] && [ "$INSTALL_RC" -eq 0 ] && [ "$TEST_RC" -eq 0 ] && [ "$TYPE_RC" -eq 0 ]; then npm run build >>"$LOG" 2>&1; BUILD_RC=$?; else BUILD_RC=99; fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$SCRIPT_RC" -eq 0 ] && [ "$INSTALL_RC" -eq 0 ] && [ "$TEST_RC" -eq 0 ] && [ "$TYPE_RC" -eq 0 ] && [ "$BUILD_RC" -eq 0 ]; then
            rm -f tools/stage2_accounting.py tools/stage2_integrations.py tools/stage2_posting.py tools/stage2_reversal.py .github/workflows/stage2-remediation.yml .stage2-remediation-status.md
            git add -A
            git diff --cached --check || exit 1
            git commit -m "Stage 2 stop accounting ledger drift"
            git push origin HEAD:agent/codebase-review-stage-2
            exit 0
          fi

          FAIL_LOG=$(tail -n 140 "$LOG")
          git reset --hard "$GITHUB_SHA"
          {
            echo "# Stage 2 remediation status"
            echo
            echo "Result: FAILED"
            echo "Source commit: $GITHUB_SHA"
            echo "Exit codes: transform=$SCRIPT_RC install=$INSTALL_RC test=$TEST_RC typecheck=$TYPE_RC build=$BUILD_RC"
            echo
            echo '```text'
            printf '%s\n' "$FAIL_LOG"
            echo '```'
          } > .stage2-remediation-status.md
          git add .stage2-remediation-status.md
          git commit -m "Record Stage 2 remediation failure"
          git push origin HEAD:agent/codebase-review-stage-2
          exit 1
