name: Final remediation branch cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/final-remediation-branch-cleanup.yml

permissions:
  contents: write

concurrency:
  group: corner-ops-final-remediation-cleanup
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Remove completed remediation branch and this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git push origin --delete agent/codebase-review-stage-9 || true
          rm -f .github/workflows/final-remediation-branch-cleanup.yml
          git add -A
          git diff --cached --check
          git commit -m "Remove final remediation cleanup workflow"
          git push origin HEAD:main
