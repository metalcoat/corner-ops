name: Fix published schedule email details

on:
  push:
    paths:
      - .github/workflows/fix-published-schedule-email-details.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Apply patch
        run: python scripts/fix-published-schedule-email-details.py
      - name: Verify
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm run build
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/business-schedule-publication.ts src/app/api/workforce/week-publish-v2/route.ts
          git diff --cached --check
          git commit -m "Include shifts in published schedule emails"
          git push origin HEAD:main
