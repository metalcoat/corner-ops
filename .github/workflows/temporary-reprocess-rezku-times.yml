name: Temporary Rezku Time Reprocess

on:
  push:
    branches:
      - main

jobs:
  reprocess:
    if: contains(github.event.head_commit.message, 'Trigger Rezku time reprocess')
    runs-on: ubuntu-latest
    steps:
      - name: Reprocess Aug 10-16 Rezku reports
        shell: bash
        run: |
          set -euo pipefail
          URL='https://corner-ops.vercel.app/api/temporary-rezku-time-reprocess?token=8p9hMC6eR9-6nn1Q72vMS5Q8iX8yE1wLVY2TaqhHTXM'
          for attempt in $(seq 1 20); do
            echo "Attempt $attempt"
            if curl --fail --silent --show-error --max-time 300 "$URL" -o response.json; then
              cat response.json
              exit 0
            fi
            sleep 15
          done
          echo 'Reprocess endpoint did not succeed.' >&2
          exit 1
