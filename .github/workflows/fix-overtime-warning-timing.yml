name: Fix overtime warning timing

on:
  push:
    paths:
      - .github/workflows/fix-overtime-warning-timing.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Apply patch
        run: python scripts/fix-overtime-warning-timing.py
      - name: Verify
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm run build
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/overtime-risk.ts src/app/ops/overtime/page.tsx
          git diff --cached --check
          git commit -m "Delay projected overtime warnings until late week"
          git push origin HEAD:main
