name: Run guarded schedule overtime override patch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-schedule-overtime-override-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Preserve backslashes in regex replacement text
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("tools/apply-schedule-overtime-override.py")
          text = path.read_text(encoding="utf-8")
          old = "updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)"
          new = "updated, count = re.subn(pattern, lambda _match: replacement, text, count=1, flags=re.S)"
          if text.count(old) != 1:
              raise SystemExit("Could not find the guarded regex replacement line.")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Apply guarded source changes
        run: python3 tools/apply-schedule-overtime-override.py

      - name: Write overtime regression tests
        shell: bash
        run: |
          cat > tests/schedule-overtime-override.test.ts <<'EOF'
          import test from "node:test";
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          import { join } from "node:path";

          const root = process.cwd();
          const source = (path: string) => readFileSync(join(root, path), "utf8");

          test("schedule publishing keeps 38-plus hours as a warning and permits explicit overtime approval", () => {
            const board = source("src/app/ops/workforce/schedule-board.tsx");
            assert.match(board, /blockingIssueCount - publishAnalysis\.overForty\.length/);
            assert.match(board, /OVERTIME WARNING/);
            assert.match(board, /allowOvertime/);
            assert.match(board, /disabled=\{busy \|\| !weekShifts\.length \|\| schedulePublishBlocked\}/);
            assert.match(board, /Manager confirmation required to publish/);
            assert.doesNotMatch(board, /disabled=\{busy \|\| !weekShifts\.length \|\| !publishAnalysis\.canPublish/);
          });

          test("server requires and records the manager overtime approval", () => {
            const validator = source("src/lib/schedule-publish-validation.ts");
            const route = source("src/app/api/workforce/route.ts");
            const publication = source("src/lib/business-schedule-publication.ts");
            assert.match(validator, /analysis\.overForty\.length && !input\.allowOvertime/);
            assert.match(validator, /overtimeOverride: input\.allowOvertime/);
            assert.match(route, /allowOvertime: body\.allowOvertime === true/);
            assert.match(publication, /overtimeOverride/);
            assert.match(publication, /approvedBy: input\.actor/);
            assert.match(publication, /approvedAt: new Date\(\)\.toISOString\(\)/);
          });
          EOF

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Type check
        run: npm run typecheck

      - name: Commit tested fix
        shell: bash
        run: |
          rm -f .github/workflows/apply-schedule-overtime-override.yml
          rm -f .github/workflows/apply-schedule-overtime-override-v2.yml
          rm -f tools/apply-schedule-overtime-override.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Allow manager-approved overtime when publishing schedules"
          git pull --rebase origin main
          git push origin HEAD:main
