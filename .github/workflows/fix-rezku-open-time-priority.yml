name: Fix Rezku order-open time priority

on:
  push:
    paths:
      - .github/workflows/fix-rezku-open-time-priority.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Prioritize actual order-open fields
        shell: python
        run: |
          from pathlib import Path

          # Payroll repair
          p = Path('src/lib/repair-rezku-order-times.ts')
          t = p.read_text()
          old = '''function orderOpenedValue(raw: Record<string, unknown>): unknown {
            const exact = rawLookup(raw, ["Order Opened At", "Opened At", "Open Time", "Order Time", "Created At", "Time"]);
            if (exact !== "") return exact;
            const candidates = Object.entries(raw)
              .filter(([key, value]) => {
                const normalized = normalizedKey(key);
                return value !== undefined && value !== null && String(value).trim() !== ""
                  && (normalized.includes("opened") || normalized.includes("opentime") || normalized.includes("orderopen"));
              })
              .sort(([left], [right]) => {
                const score = (key: string) => {
                  const normalized = normalizedKey(key);
                  if (normalized === "orderopenedat") return 0;
                  if (normalized.includes("openedat")) return 1;
                  if (normalized.includes("orderopen")) return 2;
                  if (normalized.includes("opened")) return 3;
                  return 4;
                };
                return score(left) - score(right);
              });
            return candidates[0]?.[1] ?? "";
          }'''
          new = '''function orderOpenedValue(raw: Record<string, unknown>): unknown {
            const strong = rawLookup(raw, ["Order Opened At", "Order Opened", "Opened At", "Opened", "Open Time", "Order Time"]);
            if (strong !== "") return strong;
            const candidates = Object.entries(raw)
              .filter(([key, value]) => {
                const normalized = normalizedKey(key);
                return value !== undefined && value !== null && String(value).trim() !== ""
                  && (normalized.includes("opened") || normalized.includes("opentime") || normalized.includes("orderopen"));
              })
              .sort(([left], [right]) => {
                const score = (key: string) => {
                  const normalized = normalizedKey(key);
                  if (normalized === "orderopenedat") return 0;
                  if (normalized.includes("openedat")) return 1;
                  if (normalized.includes("orderopen")) return 2;
                  if (normalized.includes("opened")) return 3;
                  return 4;
                };
                return score(left) - score(right);
              });
            if (candidates[0]) return candidates[0][1];
            return rawLookup(raw, ["Created At", "Time"]);
          }'''
          if old not in t:
            raise SystemExit('repair orderOpenedValue block not found')
          p.write_text(t.replace(old, new, 1))

          # Eastern-time repair
          p = Path('src/lib/rezku-eastern-time.ts')
          t = p.read_text()
          old = '''function orderOpenedValue(raw: RawRow): unknown {
            const exact = rowLookup(raw, ["Order Opened At", "Opened At", "Open Time", "Order Time", "Created At", "Time"]);
            if (exact !== "") return exact;
            const candidates = Object.entries(raw)
              .filter(([key, value]) => {
                const normalized = normalizeKey(key);
                return value !== undefined && value !== null && String(value).trim() !== ""
                  && (normalized.includes("opened") || normalized.includes("opentime") || normalized.includes("orderopen"));
              })
              .sort(([left], [right]) => {
                const score = (key: string) => {
                  const normalized = normalizeKey(key);
                  if (normalized === "orderopenedat") return 0;
                  if (normalized.includes("openedat")) return 1;
                  if (normalized.includes("orderopen")) return 2;
                  if (normalized.includes("opened")) return 3;
                  return 4;
                };
                return score(left) - score(right);
              });
            return candidates[0]?.[1] ?? "";
          }'''
          new = '''function orderOpenedValue(raw: RawRow): unknown {
            const strong = rowLookup(raw, ["Order Opened At", "Order Opened", "Opened At", "Opened", "Open Time", "Order Time"]);
            if (strong !== "") return strong;
            const candidates = Object.entries(raw)
              .filter(([key, value]) => {
                const normalized = normalizeKey(key);
                return value !== undefined && value !== null && String(value).trim() !== ""
                  && (normalized.includes("opened") || normalized.includes("opentime") || normalized.includes("orderopen"));
              })
              .sort(([left], [right]) => {
                const score = (key: string) => {
                  const normalized = normalizeKey(key);
                  if (normalized === "orderopenedat") return 0;
                  if (normalized.includes("openedat")) return 1;
                  if (normalized.includes("orderopen")) return 2;
                  if (normalized.includes("opened")) return 3;
                  return 4;
                };
                return score(left) - score(right);
              });
            if (candidates[0]) return candidates[0][1];
            return rowLookup(raw, ["Created At", "Time"]);
          }'''
          if old not in t:
            raise SystemExit('eastern orderOpenedValue block not found')
          t = t.replace(old, new, 1)
          p.write_text(t)

          # Allocator duplicate preference: generic Time/Created At cannot prove an order-open clock.
          p = Path('src/lib/payroll-summary-rules.ts')
          t = p.read_text()
          t = t.replace('["Order Opened At", "Order Opened", "Opened At", "Opened", "Open Time", "Order Time", "Created At", "Time"]', '["Order Opened At", "Order Opened", "Opened At", "Opened", "Open Time", "Order Time"]')
          p.write_text(t)

          # Future imports: use a dedicated fuzzy order-open lookup rather than generic Time first.
          p = Path('src/lib/operations.ts')
          t = p.read_text()
          marker = '''function parseDate(value: unknown): Date | null {'''
          helper = '''function orderOpenedLookup(row: Record<string, unknown>): unknown {
            const strong = rowLookup(row, ["Order Opened At", "Order Opened", "Opened At", "Opened", "Open Time", "Order Time"]);
            if (strong !== "") return strong;
            const candidates = Object.entries(row)
              .filter(([key, value]) => {
                const normalized = normalizeKey(key);
                return value !== undefined && value !== null && String(value).trim() !== ""
                  && (normalized.includes("opened") || normalized.includes("opentime") || normalized.includes("orderopen"));
              });
            if (candidates[0]) return candidates[0][1];
            return rowLookup(row, ["Created At", "Time"]);
          }

          '''
          if 'function orderOpenedLookup(row:' not in t:
            t = t.replace(marker, helper + marker, 1)
          t = t.replace('const openedAt = combineDateAndTime(dateValue, rowLookup(row, ["Order Opened At", "Order Opened", "Opened At", "Opened", "Open Time", "Order Time", "Created At", "Time"]));', 'const openedAt = combineDateAndTime(dateValue, orderOpenedLookup(row));')
          p.write_text(t)
      - name: Verify
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm run build
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/repair-rezku-order-times.ts src/lib/rezku-eastern-time.ts src/lib/payroll-summary-rules.ts src/lib/operations.ts
          git diff --cached --check
          git commit -m "Prioritize actual Rezku order-open timestamps"
          git push origin HEAD:main
