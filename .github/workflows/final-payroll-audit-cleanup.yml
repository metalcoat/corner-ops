name: Final payroll audit cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/final-payroll-audit-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Remove temporary payroll audit branch and this workflow
        shell: bash
        run: |
          set -euo pipefail
          git push origin --delete audit/payroll-history-diff || true
          rm -f .github/workflows/final-payroll-audit-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Remove final payroll audit cleanup workflow"
          git push origin HEAD:main
