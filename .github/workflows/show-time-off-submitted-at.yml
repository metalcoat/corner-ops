name: Show time-off submission timestamp

on:
  push:
    paths:
      - .github/workflows/show-time-off-submitted-at.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Apply patch
        run: python scripts/show-time-off-submitted-at.py
      - name: Verify
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm run build
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/ops/workforce/page.tsx
          git diff --cached --check
          git commit -m "Show time-off submission timestamps"
          git push origin HEAD:main
