name: Add message photo preview

on:
  push:
    paths:
      - .github/workflows/add-message-photo-preview.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Apply patch
        run: python scripts/add-message-photo-preview.py
      - name: Verify
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm run build
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/employee/messages-dock.tsx src/app/employee/messages-dock.css
          git diff --cached --check
          git commit -m "Preview and remove message photo attachments"
          git push origin HEAD:main
