name: Fix payroll midnight week boundary

on:
  push:
    paths:
      - .github/workflows/fix-payroll-midnight-week-boundary.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Set payroll week to Monday midnight
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/lib/payroll-summary-rules.ts')
          t = p.read_text()
          old = 'const start = zonedDateToUtc(weekStart, 4);'
          new = 'const start = zonedDateToUtc(weekStart, 0);'
          if old not in t:
            raise SystemExit('expected 4 AM payroll boundary not found')
          t = t.replace(old, new, 1)
          p.write_text(t)
      - name: Verify
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm run build
          grep -n "zonedDateToUtc(weekStart, 0)" src/lib/payroll-summary-rules.ts
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/payroll-summary-rules.ts
          git diff --cached --check
          git commit -m "Use Monday midnight payroll week boundary"
          git push origin HEAD:main
