name: Read production payroll fix diagnostic

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/read-payroll-fix-diagnostic.yml

permissions:
  contents: read

jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for production diagnostic
        shell: bash
        run: |
          set -euo pipefail
          url="https://corner-ops.vercel.app/payroll-fix-20260829-kayli.json?commit=${GITHUB_SHA}"
          for attempt in $(seq 1 40); do
            body="$(curl --fail --silent --show-error --header 'Cache-Control: no-cache' "$url" 2>/dev/null || true)"
            if printf '%s' "$body" | grep -q '"generatedAt"'; then
              echo "PAYROLL_FIX_DIAGNOSTIC_BEGIN"
              printf '%s\n' "$body"
              echo "PAYROLL_FIX_DIAGNOSTIC_END"
              exit 0
            fi
            sleep 15
          done
          echo "Production diagnostic was not available after 10 minutes." >&2
          exit 1
