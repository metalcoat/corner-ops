name: Apply CODEBASEREVIEW Stage 4

on:
  push:
    branches:
      - agent/codebase-review-stage-4
    paths:
      - tools/stage4_auth.py
      - tools/stage4_crypto.py
      - tools/stage4_compliance_audit.py
      - .github/workflows/stage4-remediation.yml

permissions:
  contents: write

concurrency:
  group: corner-ops-stage4-remediation
  cancel-in-progress: false

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/codebase-review-stage-4
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Generate throwaway CI secrets
        shell: bash
        run: |
          echo "SESSION_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "OWNER_SESSION_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "EMPLOYEE_SESSION_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "DELI_BOARD_SESSION_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "EMPLOYEE_PIN_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "INTEGRATION_ENCRYPTION_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "OAUTH_STATE_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "APPLICATION_DATA_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "EMPLOYMENT_FORMS_ENCRYPTION_KEY=$(openssl rand -base64 32 | tr -d '\n')" >> "$GITHUB_ENV"
          echo "APP_EMAIL=owner@example.test" >> "$GITHUB_ENV"
          echo "DATABASE_URL=postgresql://placeholder:placeholder@localhost:5432/placeholder" >> "$GITHUB_ENV"
          echo "BLOB_READ_WRITE_TOKEN=vercel_blob_rw_placeholder" >> "$GITHUB_ENV"
      - name: Apply and verify Stage 4
        shell: bash
        run: |
          set +e
          LOG=/tmp/stage4.log
          : > "$LOG"
          SCRIPT_RC=0
          python3 - <<'PY' >>"$LOG" 2>&1
          from pathlib import Path
          path = Path('tools/stage4_compliance_audit.py')
          text = path.read_text()
          old = "rep('src/app/api/workforce/route.ts','        actor: session.displayName,\\n      }));','        actor: session.displayName,\\n        sendSms: body.sendSms === true,\\n      }));')"
          new = "sub('src/app/api/workforce/route.ts',r'(if \\(action === \\\"message-send\\\"\\) \\{.*?actor: session\\.displayName,)\\n      \\}\\)\\);',r'\\1\\n        sendSms: body.sendSms === true,\\n      }));')"
          if old not in text:
              raise SystemExit('stage4 transformer target not found')
          path.write_text(text.replace(old, new, 1))
          PY
          PREP_RC=$?
          if [ "$PREP_RC" -ne 0 ]; then SCRIPT_RC=$PREP_RC; fi
          if [ "$SCRIPT_RC" -eq 0 ]; then
            for script in tools/stage4_auth.py tools/stage4_crypto.py tools/stage4_compliance_audit.py; do
              python3 "$script" >>"$LOG" 2>&1 || { SCRIPT_RC=$?; break; }
            done
          fi
          if [ "$SCRIPT_RC" -eq 0 ]; then npm ci >>"$LOG" 2>&1; INSTALL_RC=$?; else INSTALL_RC=99; fi
          if [ "$SCRIPT_RC" -eq 0 ] && [ "$INSTALL_RC" -eq 0 ]; then npm test >>"$LOG" 2>&1; TEST_RC=$?; else TEST_RC=99; fi
          if [ "$SCRIPT_RC" -eq 0 ] && [ "$INSTALL_RC" -eq 0 ] && [ "$TEST_RC" -eq 0 ]; then npm run typecheck >>"$LOG" 2>&1; TYPE_RC=$?; else TYPE_RC=99; fi
          if [ "$SCRIPT_RC" -eq 0 ] && [ "$INSTALL_RC" -eq 0 ] && [ "$TEST_RC" -eq 0 ] && [ "$TYPE_RC" -eq 0 ]; then npm run build >>"$LOG" 2>&1; BUILD_RC=$?; else BUILD_RC=99; fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$SCRIPT_RC" -eq 0 ] && [ "$INSTALL_RC" -eq 0 ] && [ "$TEST_RC" -eq 0 ] && [ "$TYPE_RC" -eq 0 ] && [ "$BUILD_RC" -eq 0 ]; then
            rm -f tools/stage4_auth.py tools/stage4_crypto.py tools/stage4_compliance_audit.py .github/workflows/stage4-remediation.yml .stage4-remediation-status.md
            git add -A
            git diff --cached --check || exit 1
            git commit -m "Stage 4 harden credentials sessions consent and audit"
            git push origin HEAD:agent/codebase-review-stage-4
            exit 0
          fi

          FAIL_LOG=$(tail -n 220 "$LOG")
          git reset --hard "$GITHUB_SHA"
          {
            echo "# Stage 4 remediation status"
            echo
            echo "Result: FAILED"
            echo "Source commit: $GITHUB_SHA"
            echo "Exit codes: transform=$SCRIPT_RC install=$INSTALL_RC test=$TEST_RC typecheck=$TYPE_RC build=$BUILD_RC"
            echo
            echo '```text'
            printf '%s\n' "$FAIL_LOG"
            echo '```'
          } > .stage4-remediation-status.md
          git add .stage4-remediation-status.md
          git commit -m "Record Stage 4 remediation failure"
          git push origin HEAD:agent/codebase-review-stage-4
          exit 1
