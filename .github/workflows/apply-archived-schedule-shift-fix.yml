name: Apply archived employee schedule repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-archived-schedule-shift-fix.yml
      - tools/apply-archived-schedule-shift-fix.py

permissions:
  contents: write

concurrency:
  group: archived-schedule-shift-fix
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Repair SQL quote boundary in one-time patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("tools/apply-archived-schedule-shift-fix.py")
          text = path.read_text(encoding="utf-8")
          needle = "      AND t.status = 'Approved' ''',"
          if text.count(needle) != 2:
              raise SystemExit(f"Expected two SQL quote-boundary matches, found {text.count(needle)}")
          path.write_text(text.replace(needle, "      AND t.status = 'Approved'\n''',"), encoding="utf-8")
          PY

      - name: Apply guarded source changes
        run: python3 tools/apply-archived-schedule-shift-fix.py

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Type check
        run: npm run typecheck

      - name: Build application
        run: npm run build
        env:
          APP_EMAIL: owner@example.test
          DATABASE_URL: ""
          BLOB_READ_WRITE_TOKEN: vercel_blob_rw_placeholder
          SESSION_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          EMPLOYMENT_FORMS_ENCRYPTION_KEY: abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789

      - name: Commit tested repair
        shell: bash
        run: |
          rm -f .github/workflows/apply-archived-schedule-shift-fix.yml
          rm -f tools/apply-archived-schedule-shift-fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Keep schedule publish counts aligned with visible shifts" \
            -m "Release future shifts when an employee is archived, expose legacy archived assignments as open shifts, prevent publication from assigning inactive staff, and repair existing future assignments during production migration."
          git pull --rebase origin main
          git push origin HEAD:main
