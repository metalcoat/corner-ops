name: Apply CODEBASEREVIEW Stage 8 Cutover

on:
  push:
    branches:
      - agent/codebase-review-stage-8
    paths:
      - tools/stage8_remove_runtime_ddl.py
      - tools/stage8_ddl_scan.py
      - .github/workflows/stage8-cutover.yml
  pull_request:
    branches: [main]
    paths:
      - tools/stage8_remove_runtime_ddl.py
      - tools/stage8_ddl_scan.py
      - .github/workflows/stage8-cutover.yml

permissions:
  contents: write

concurrency:
  group: corner-ops-stage8-cutover
  cancel-in-progress: true

jobs:
  cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/codebase-review-stage-8
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Generate CI-only secrets
        shell: bash
        run: |
          echo "SESSION_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "OWNER_SESSION_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "EMPLOYEE_SESSION_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "DELI_BOARD_SESSION_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "EMPLOYEE_PIN_PEPPER=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "INTEGRATION_ENCRYPTION_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "SQUARE_OAUTH_STATE_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "KEY_ENCRYPTION_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "EMPLOYMENT_FORMS_ENCRYPTION_KEY=$(openssl rand -base64 32 | tr -d '\n')" >> "$GITHUB_ENV"
          echo "APP_EMAIL=owner@example.test" >> "$GITHUB_ENV"
          echo "APP_PASSWORD=$(openssl rand -base64 32 | tr -d '\n')" >> "$GITHUB_ENV"
          echo "DATABASE_URL=postgresql://placeholder:placeholder@localhost:5432/placeholder" >> "$GITHUB_ENV"
          echo "BLOB_READ_WRITE_TOKEN=vercel_blob_rw_placeholder" >> "$GITHUB_ENV"
      - name: Transform and verify
        shell: bash
        run: |
          set +e
          LOG=/tmp/stage8-cutover.log
          : > "$LOG"
          python3 tools/stage8_remove_runtime_ddl.py >>"$LOG" 2>&1
          TRANSFORM_RC=$?
          if [ "$TRANSFORM_RC" -eq 0 ]; then python3 tools/stage8_ddl_scan.py >>"$LOG" 2>&1; SCAN_RC=$?; else SCAN_RC=99; fi
          if [ "$TRANSFORM_RC" -eq 0 ]; then npm ci >>"$LOG" 2>&1; INSTALL_RC=$?; else INSTALL_RC=99; fi
          if [ "$INSTALL_RC" -eq 0 ]; then npm test >>"$LOG" 2>&1; TEST_RC=$?; else TEST_RC=99; fi
          if [ "$TEST_RC" -eq 0 ]; then npm run typecheck >>"$LOG" 2>&1; TYPE_RC=$?; else TYPE_RC=99; fi
          if [ "$TYPE_RC" -eq 0 ]; then npm run build >>"$LOG" 2>&1; BUILD_RC=$?; else BUILD_RC=99; fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$TRANSFORM_RC" -eq 0 ] && [ "$SCAN_RC" -eq 0 ] && [ "$INSTALL_RC" -eq 0 ] && [ "$TEST_RC" -eq 0 ] && [ "$TYPE_RC" -eq 0 ] && [ "$BUILD_RC" -eq 0 ]; then
            {
              echo "# Stage 8 cutover status"
              echo
              echo "Result: SUCCESS"
              echo "Source commit: $GITHUB_SHA"
              echo
              cat .stage8-ddl-scan.md
            } > .stage8-cutover-status.md
            git add -A
            git diff --cached --check || exit 1
            git commit -m "Stage 8 remove first-pass runtime schema DDL"
            git push origin HEAD:agent/codebase-review-stage-8
            exit 0
          fi

          FAIL_LOG=$(tail -n 320 "$LOG")
          git reset --hard "$GITHUB_SHA"
          {
            echo "# Stage 8 cutover status"
            echo
            echo "Result: FAILED"
            echo "Source commit: $GITHUB_SHA"
            echo "Exit codes: transform=$TRANSFORM_RC scan=$SCAN_RC install=$INSTALL_RC test=$TEST_RC typecheck=$TYPE_RC build=$BUILD_RC"
            echo
            echo '```text'
            printf '%s\n' "$FAIL_LOG"
            echo '```'
          } > .stage8-cutover-status.md
          git add .stage8-cutover-status.md
          git commit -m "Record Stage 8 cutover failure"
          git push origin HEAD:agent/codebase-review-stage-8
          exit 1
