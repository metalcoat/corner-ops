name: Fix time-off date display

on:
  push:
    paths:
      - .github/workflows/fix-time-off-date-display.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Apply patch
        run: python scripts/fix-time-off-date-display.py
      - name: Verify
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm run build
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/workforce.ts src/app/ops/workforce/page.tsx
          git diff --cached --check
          git commit -m "Normalize time-off dates for display"
          git push origin HEAD:main
