name: Verify Corner Ops Schema Baseline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: corner-ops-schema-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: corner_ops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d corner_ops_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: corner_ops_test
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild production baseline from committed migrations
        shell: bash
        run: |
          set -euo pipefail
          for file in $(find db/migrations -maxdepth 1 -type f -name '0001*.sql' | sort); do
            echo "Applying $file"
            psql -v ON_ERROR_STOP=1 -f "$file"
          done
      - name: Verify baseline inventory
        shell: bash
        run: |
          set -euo pipefail
          tables=$(psql -Atc "SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='public' AND c.relkind='r'")
          functions=$(psql -Atc "SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace WHERE n.nspname='public'")
          triggers=$(psql -Atc "SELECT count(*) FROM pg_trigger t JOIN pg_class c ON c.oid=t.tgrelid JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='public' AND NOT t.tgisinternal")
          accounts=$(psql -Atc "SELECT count(*) FROM accounting_accounts")
          test "$tables" = "117"
          test "$functions" = "6"
          test "$triggers" = "5"
          test "$accounts" = "28"
          echo "Baseline verified: $tables tables, $functions functions, $triggers triggers, $accounts seeded accounts."
