name: Verify Corner Ops Schema Baseline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: corner-ops-schema-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: corner_ops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d corner_ops_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: corner_ops_test
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild production baseline from committed migrations
        shell: bash
        run: |
          set -euo pipefail
          for file in $(find db/migrations -maxdepth 1 -type f -name '0001*.sql' | sort); do
            echo "Applying baseline $file"
            psql -v ON_ERROR_STOP=1 -f "$file"
          done
      - name: Verify baseline inventory
        shell: bash
        run: |
          set -euo pipefail
          tables=$(psql -Atc "SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='public' AND c.relkind='r'")
          functions=$(psql -Atc "SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace WHERE n.nspname='public'")
          triggers=$(psql -Atc "SELECT count(*) FROM pg_trigger t JOIN pg_class c ON c.oid=t.tgrelid JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='public' AND NOT t.tgisinternal")
          accounts=$(psql -Atc "SELECT count(*) FROM accounting_accounts")
          test "$tables" = "117"
          test "$functions" = "6"
          test "$triggers" = "5"
          test "$accounts" = "28"
          echo "Baseline verified: $tables tables, $functions functions, $triggers triggers, $accounts seeded accounts."
      - name: Apply post-baseline migrations
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            name=$(basename "$file")
            if [[ "$name" > "0007_schedule_delivery_queue.sql" ]]; then
              echo "Applying post-baseline migration $file"
              psql -v ON_ERROR_STOP=1 -f "$file"
            fi
          done < <(find db/migrations -maxdepth 1 -type f -name '*.sql' | sort)
      - name: Verify current schema migrations
        shell: bash
        run: |
          set -euo pipefail
          test "$(psql -Atc "SELECT to_regclass('public.deli_board_call_cache') IS NOT NULL")" = "t"
          test "$(psql -Atc "SELECT count(*) FROM deli_wallboard_tasks WHERE created_by='System'")" = "26"
          echo "Post-baseline migrations verified."
