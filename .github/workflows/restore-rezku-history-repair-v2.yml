name: Restore Rezku historical repair v2

on:
  push:
    paths:
      - .github/workflows/restore-rezku-history-repair-v2.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Restore corrected historical repair route
        shell: bash
        run: |
          mkdir -p src/app/api/temporary-rezku-order-repair
          git show 91033302212dc3abf16ae6763876be1a20bd2fd1:src/app/api/temporary-rezku-order-repair/route.ts > src/app/api/temporary-rezku-order-repair/route.ts
          python - <<'PY'
          from pathlib import Path
          p = Path('src/app/api/temporary-rezku-order-repair/route.ts')
          t = p.read_text()
          t = t.replace('temporary-rezku-history-2026-08-03', 'temporary-rezku-history-2026-08-03-v2')
          t = t.replace('"repaired": true', '"repaired": true')
          p.write_text(t)
          PY
      - name: Verify
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm run build
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/api/temporary-rezku-order-repair/route.ts
          git diff --cached --check
          git commit -m "Restore Rezku historical repair v2"
          git push origin HEAD:main
